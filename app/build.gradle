plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = signingKeys.every { signingProperties.getProperty(it)?.trim() } &&
    rootProject.file(signingProperties.getProperty('storeFile', '')).isFile()

android {
    namespace 'com.example.bestscaffold'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.bestscaffold"
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    api project(':codec_core')
    api project(':native_camera_core')
    api project(':camera_core')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.gson
}

